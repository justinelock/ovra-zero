http:
  routers:
    # auth
    router-auth:
      rule: "PathPrefix(`/auth`)"
      entryPoints:
        - websecure
      service: service-auth
      middlewares:
        - cors-header

    # System 子路径（含业务 API：/member、/fund、/trade、/app 等均在 system 服务）
    router-system:
      rule: "(PathPrefix(`/system`) || PathPrefix(`/monitor`) || PathPrefix(`/resource`) || PathPrefix(`/member`) || PathPrefix(`/fund`) || PathPrefix(`/trade`) || PathPrefix(`/invest`) || PathPrefix(`/product`) || PathPrefix(`/notify`) || PathPrefix(`/kline`) || PathPrefix(`/app`) || PathPrefix(`/dashboard`))"
      entryPoints:
        - websecure
      service: service-system
      middlewares:
        - cors-header

    # demo
    router-demo:
      rule: "PathPrefix(`/demo`)"
      entryPoints:
        - websecure
      service: service-demo
      middlewares:
        - cors-header


  services:
    service-auth:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8085"

    service-system:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8086"

    service-demo:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8099"

  middlewares:
    cors-header:
      headers:
        accessControlAllowOriginList:
          - "*"
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "*"
        accessControlAllowCredentials: true
        addVaryHeader: true
